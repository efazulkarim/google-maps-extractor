<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Maps Scraper</title>
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <div id="maincontent" style="width: 100%">
        <div id="content">
            <div style="
            padding: 0;
            display: flex;
            flex-direction: row;
            height: 50px;
            align-items:flex-start;
            text-align: center;
            justify-content: space-between;
          ">
                <h2 style="text-align: left;">Maps Scraper</h2>
            </div>
            <div style="
            padding: 5px 0;
            display: flex;
            flex-direction: row;
            width: 100%;
            align-items: center;
            justify-content:flex-end;
            gap: 10px;
            border-bottom: 1px solid #cccccc;
            margin-bottom: 10px;
          ">
                <div><span id="accountinfo" style="font-weight: bold; font-size: 16px;"></span></div>
            </div>
            <div style="
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: left;
            gap: 20px;
            row-gap: 20px;

            height: 150px;
          ">
                <div style="display: flex; align-items: flex-start; justify-content: space-evenly; flex-direction: column; gap: 20px;">
                    <input type="text" id="profileid" value="coffee shop near new york" style="height: 20px; width: 300px; border-radius: 0.375rem; border: 1px #ccc solid; padding: 10px;" />
                    <button id="addprofilebtn" style="width: 200px; height: 40px; background-color:#4f46e5; color: #fff; border:0; border-radius:8px; cursor:pointer; font-weight:600;">Search Google Maps</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/popup.js"></script>
</body>

</html>
